# Render blueprint: a public, multi-tenant AgentGuard service with managed Postgres.
#
#   One click: https://render.com/deploy?repo=https://github.com/Alexm2025/agentguard
#
# Render asks for the values marked `sync: false`. Everything else is generated or wired up.
# Plans: `free` is fine to try it out (the web service sleeps when idle and free Postgres
# databases expire after 30 days). For a product people depend on, switch both to paid plans.
services:
  - type: web
    name: agentguard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    dockerCommand: sh -c "agentguard server migrate && agentguard server run --host 0.0.0.0 --port $PORT"
    envVars:
      - key: AGENTGUARD_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: agentguard-db, property: connectionString }
      - key: AGENTGUARD_SECRET_KEY
        generateValue: true
      - key: AGENTGUARD_SERVICE_TOKEN
        generateValue: true
      - key: AGENTGUARD_ALLOW_SIGNUP
        value: "true"
      - key: AGENTGUARD_TRUST_PROXY_HEADERS
        value: "true"
      # ML classifier weights, downloaded and checksum-verified during the Docker build
      # (Render passes environment variables to the build as build arguments).
      - key: MODEL_URL
        value: https://github.com/Alexm2025/agentguard/releases/download/model-injection-classifier-v1/injection-classifier-v1.tar.gz
      - key: MODEL_SHA256
        value: 2dc65b80bbf2d65ff2bac693555523fa12fb16961c77a10063549bf2397dc480
      # Shown on the Terms and Privacy pages: who runs this service and how to reach them.
      - key: AGENTGUARD_OPERATOR_NAME
        sync: false
      - key: AGENTGUARD_CONTACT_EMAIL
        sync: false
      # Optional but recommended for a public service: email verification and password reset.
      - key: AGENTGUARD_SMTP_URL
        sync: false
      - key: AGENTGUARD_MAIL_FROM
        sync: false
      # Optional: your own first admin account (otherwise just sign up on the site).
      - key: AGENTGUARD_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: AGENTGUARD_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: agentguard-db
    plan: free
    databaseName: agentguard
    user: agentguard
