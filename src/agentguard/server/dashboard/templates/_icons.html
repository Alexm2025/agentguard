{%- elif name == "globe" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>

{% macro mark() -%}
<span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
{%- endmacro %}

{% macro action_pill(action, lg=False) -%}
{%- set labels = {"BLOCK": "Blocked", "REQUIRE_APPROVAL": "Needs approval", "REDACT": "Redacted", "ALLOW": "Allowed"} -%}
<span class="pill {{ action|lower }}{% if lg %} lg{% endif %}">{{ labels.get(action, action) }}</span>
{%- endmacro %}
