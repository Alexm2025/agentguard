{% extends "base.html" %}
{% from "_icons.html" import mark %}
{% block title %}Choose a new password{% endblock %}
{% block bare %}
<main class="auth">
  <section class="auth-card">
    <div class="head">{{ mark("lg") }}<h1>Choose a new password</h1><p class="lead">You'll be signed out on all other devices.</p></div>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/reset">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <input type="hidden" name="token" value="{{ token }}">
      <label>New password <input type="password" name="password" autocomplete="new-password" required minlength="12" autofocus>
        <span class="hint">At least 12 characters.</span></label>
      <button type="submit" class="block lg">Update password</button>
    </form>
  </section>
</main>
{% endblock %}
