apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentguard.fullname" . }}-gateway
  labels: {{- include "agentguard.labels" . | nindent 4 }}
data:
  gateway.yaml: |
    pins_file: /tmp/agentguard-pins.json
    control_plane:
      url: http://{{ include "agentguard.fullname" . }}-server:8000
      token_env: AGENTGUARD_SERVICE_TOKEN
    {{- toYaml .Values.gatewayConfig | nindent 4 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentguard.fullname" . }}
  labels: {{- include "agentguard.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toJson . }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toJson . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /v1, pathType: Prefix, backend: { service: { name: {{ include "agentguard.fullname" . }}-llm-gateway, port: { number: 8200 } } } }
          - { path: /servers, pathType: Prefix, backend: { service: { name: {{ include "agentguard.fullname" . }}-mcp-gateway, port: { number: 8100 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: {{ include "agentguard.fullname" . }}-server, port: { number: 8000 } } } }
{{- end }}
