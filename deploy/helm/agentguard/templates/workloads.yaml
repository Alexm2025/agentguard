{{- $root := . -}}
{{- $components := list
  (dict "key" "server" "name" "server" "port" 8000 "args" (list "server" "run") "values" .Values.server)
  (dict "key" "llmGateway" "name" "llm-gateway" "port" 8200 "args" (list "gateway" "llm" "--config" "/config/gateway.yaml" "--workers" (toString .Values.llmGateway.workers)) "values" .Values.llmGateway)
  (dict "key" "mcpGateway" "name" "mcp-gateway" "port" 8100 "args" (list "gateway" "mcp-http" "--config" "/config/gateway.yaml") "values" .Values.mcpGateway)
-}}
{{- range $c := $components }}
{{- if $c.values.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentguard.fullname" $root }}-{{ $c.name }}
  labels: {{- include "agentguard.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $c.name }}
spec:
  replicas: {{ $c.values.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $c.name }} }
  template:
    metadata:
      labels: {{- include "agentguard.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $c.name }}
      annotations:
        checksum/config: {{ toJson $root.Values.gatewayConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{ toJson $root.Values.podSecurityContext }}
      containers:
        {{- include "agentguard.container" (dict "root" $root "name" $c.name "port" $c.port "args" $c.args "resources" $c.values.resources) | nindent 8 }}
      volumes:
        {{- include "agentguard.volumes" $root | nindent 8 }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector: {{ toJson . }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations: {{ toJson . }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity: {{ toJson . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentguard.fullname" $root }}-{{ $c.name }}
  labels: {{- include "agentguard.labels" $root | nindent 4 }}
spec:
  {{- if eq $c.name "mcp-gateway" }}
  # MCP sessions keep taint state in memory: pin each client to one pod.
  sessionAffinity: ClientIP
  {{- end }}
  selector: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $c.name }} }
  ports: [{ name: http, port: {{ $c.port }}, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agentguard.fullname" $root }}-{{ $c.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $root.Release.Name }}, app.kubernetes.io/component: {{ $c.name }} }
{{- if and $c.values.autoscaling $c.values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentguard.fullname" $root }}-{{ $c.name }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "agentguard.fullname" $root }}-{{ $c.name }} }
  minReplicas: {{ $c.values.autoscaling.minReplicas }}
  maxReplicas: {{ $c.values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $c.values.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
{{- end }}
{{- end }}
