{{- if and .Values.server.enabled .Values.server.migrateOnInstall }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentguard.fullname" . }}-migrate
  labels: {{- include "agentguard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{ toJson .Values.podSecurityContext }}
      containers:
        - name: migrate
          image: {{ include "agentguard.image" . }}
          args: ["server", "migrate"]
          env:
            {{- include "agentguard.env" . | nindent 12 }}
          securityContext: {{ toJson .Values.securityContext }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
